name: Build Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS (intel)
          - os: macos-latest
            target: darwin-amd64
            goarch: amd64
          # macOS (Apple Silicon)
          - os: macos-latest
            target: darwin-arm64
            goarch: arm64
          # Linux (amd64)
          - os: ubuntu-latest
            target: linux-amd64
            goarch: amd64
          # Linux (arm64)
          - os: ubuntu-latest
            target: linux-arm64
            goarch: arm64
          # Windows
          - os: windows-latest
            target: windows-amd64
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install sqlite3

      - name: Build sqlite-vec static library
        run: |
          ./scripts/build-sqlite-vec.sh

      - name: Build DivineSense
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          make build PROD=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: divinesense-${{ matrix.target }}
          path: divinesense*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.create_release.outputs.html_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            divinesense-*
            !divinesense-*.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
