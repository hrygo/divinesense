name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "**.go"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy -go=1.25
          git diff --exit-code

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0
          args: --config=.golangci.yaml --timeout=3m --build-tags=noui

  go-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-group: store
            test-path: ./store/...
          - test-group: server
            test-path: ./server/...
          - test-group: plugin
            test-path: $(go list ./plugin/... | grep -v "github.com/hrygo/divinesense/plugin/cron$")
          - test-group: other
            test-path: ./cmd/... ./internal/...
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: go.sum

      # Use reusable action for test execution
      - name: Run tests - ${{ matrix.test-group }}
        id: tests
        uses: ./.github/actions/go-test
        with:
          path: ${{ matrix.test-path }}
        env:
          DRIVER: sqlite  # Use SQLite for fastest test execution

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          flags: ${{ matrix.test-group }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test_group }}
          path: test.json
