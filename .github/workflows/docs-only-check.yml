name: Docs-Only Check

# 智能文档变更检测 - 当 PR 仅包含文档变更时跳过完整测试
# 规则: 如果所有变更都在 docs/**, *.md, README* 范围内，跳过后端/前端测试

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  statuses: write
  contents: read

jobs:
  detect-docs-only:
    name: Detect Docs-Only Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          # 获取变更的文件列表 (相对于 main 分支)
          git diff --name-only origin/main...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

          # 检查是否存在非文档文件变更
          # 文档文件定义: docs/**, *.md, README*, CONTRIBUTING*, LICENSE*
          # 排除的目录: web/**, server/**, ai/**, plugin/**, store/**, cmd/**, proto/**, .github/**

          non_doc_files=$(grep -vE '^(docs/|.*\.md$|README|CONTRIBUTING|LICENSE|CHANGELOG|\.claignore|\.gitignore)' changed_files.txt || true)

          if [ -z "$non_doc_files" ]; then
            echo "docs-only=true" >> $GITHUB_OUTPUT
            echo "✅ This PR contains documentation changes only"
          else
            echo "docs-only=false" >> $GITHUB_OUTPUT
            echo "📦 This PR contains code changes"
            echo "Non-doc files:"
            echo "$non_doc_files"
          fi

  docs-only-status:
    name: Set Docs-Only Status
    runs-on: ubuntu-latest
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs-only == 'true'
    steps:
      - name: Report docs-only status
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;

            // 设置成功状态，表示文档变更无需运行完整测试
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state: 'success',
              context: 'ci/docs-only',
              description: 'Documentation only - tests skipped',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            });

            // 同时标记后端和前端测试为跳过状态
            for (const context of ['ci/backend-tests', 'ci/frontend-tests']) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state: 'success',
                context,
                description: 'Skipped (docs-only PR)',
                target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
              });
            }

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context;

            // 查找是否已存在相同的评论
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('ℹ️ Documentation-Only PR')
            );

            const message = `ℹ️ **Documentation-Only PR**

            This PR contains only documentation changes. Full CI tests have been skipped to save resources.

            • Backend tests: Skipped
            • Frontend tests: Skipped
            • Docs-only check: ✅ Passed`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: message
              });
            }
