<svg width="1200" height="140" viewBox="0 0 1200 140" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
     <linearGradient id="divine_gradient" x1="0" y1="0" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>


  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 80px; fill: url(#divine_gradient); letter-spacing: -1px; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 24px; fill: #94a3b8; letter-spacing: 6px; text-transform: uppercase; }
    .icon-stroke { stroke: url(#divine_gradient); stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: url(#glow); }
    .icon-fill { fill: url(#divine_gradient); filter: url(#glow); }

    /* 神识之眼动效 */
    .eye-container {
      animation: eye-breathe 3s ease-in-out infinite;
      transform-origin: center;
    }

    .pupil-center {
      animation: pupil-pulse 2.5s ease-in-out infinite;
      transform-origin: center;
      will-change: transform;
    }

    .pupil-outer {
      animation: pupil-glow 2.5s ease-in-out infinite;
      transform-origin: center;
    }

    .ray-line {
      animation: ray-scan 1.5s ease-in-out infinite;
      transform-origin: 100px 100px;
    }

    .ray-1 { animation-delay: 0s; }
    .ray-2 { animation-delay: 0.2s; }
    .ray-3 { animation-delay: 0.4s; }
    .ray-4 { animation-delay: 0.6s; }

    @keyframes eye-breathe {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes pupil-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.9;
      }
    }

    @keyframes pupil-glow {
      0%, 100% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes ray-scan {
      0%, 100% {
        opacity: 0.3;
      }
      50% {
        opacity: 0.9;
      }
    }
  </style>

  <!-- Content Group -->

  <!-- Icon centered at center_x -->
  <g transform="translate(530.0, 0) scale(0.7)" class="eye-container">
      <path class="icon-stroke" d="M100 30 C 60 30 30 60 30 100 C 30 140 60 170 100 170 C 140 170 170 140 170 100 C 170 60 140 30 100 30 Z" opacity="0.5"/>
      <path class="ray-line ray-1" d="M100 100 L 70 70" />
      <path class="ray-line ray-2" d="M100 100 L 130 70" />
      <path class="ray-line ray-3" d="M100 100 L 70 130" />
      <path class="ray-line ray-4" d="M100 100 L 130 130" />
      <circle class="pupil-center" cx="100" cy="100" r="15" />
      <circle class="pupil-outer" cx="70" cy="70" r="6" />
      <circle class="pupil-outer" cx="130" cy="70" r="6" />
      <circle class="pupil-outer" cx="70" cy="130" r="6" />
      <circle class="pupil-outer" cx="130" cy="130" r="6" />
      <circle class="pupil-outer" cx="100" cy="30" r="4" />
      <circle class="pupil-outer" cx="30" cy="100" r="4" />
      <circle class="pupil-outer" cx="170" cy="100" r="4" />
  </g>

  <!-- Part 1: Aligned END (Right) to the Left of Icon -->
  <g transform="translate(505.0, 0)">
     <text class="title" x="0" y="50%" style="font-size: 72px; text-anchor: end; dominant-baseline: central; alignment-baseline: central;">智能</text>
  </g>

  <!-- Part 2: Aligned START (Left) to the Right of Icon -->
  <g transform="translate(695.0, 0)">
     <text class="title" x="0" y="50%" style="font-size: 72px; text-anchor: start; dominant-baseline: central; alignment-baseline: central;">助理</text>
  </g>
</svg>
